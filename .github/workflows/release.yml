name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.2)'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Trauso ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 🎉 What's New
            
            ### Installation
            Download the appropriate installer for your platform from the assets below:
            - **Windows**: Look for `.exe` (NSIS installer) or `.msi` files
            - **macOS**: Look for `.dmg` files (Universal binary works on both Intel and Apple Silicon)
            - **Linux**: Look for `.deb` (Debian/Ubuntu) or `.AppImage` (portable) files
            
            ### Notes
            - This release includes all the latest features and bug fixes
            - Auto-update is enabled for existing installations
            - Check the repository commits for detailed changes
            
            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
